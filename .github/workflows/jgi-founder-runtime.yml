name: JGI dispatch-bridge court

on:
  push:
    branches:
      - feature/jgi-founder-runtime-v0-20260901
    paths:
      - 'neuruh_workers/**'
      - 'tests/**'
      - 'scripts/**'
      - 'JGI_DISPATCH_BRIDGE.md'
      - 'JGI_FOUNDER_RUNTIME_V0.md'
      - 'docs/receipts/**'
      - '.github/workflows/jgi-founder-runtime.yml'
  pull_request:
    paths:
      - 'neuruh_workers/**'
      - 'tests/**'
      - 'scripts/**'
      - 'JGI_DISPATCH_BRIDGE.md'
      - 'JGI_FOUNDER_RUNTIME_V0.md'
      - 'docs/receipts/**'
      - '.github/workflows/jgi-founder-runtime.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full unittest discovery
        run: python3 -m unittest discover -s tests -t .
      - name: Secret scan
        run: python3 scripts/secret_scan.py
      - name: Dispatch-bridge deterministic demo
        run: |
          tmpdir="$(mktemp -d)"
          python3 scripts/run_jgi_demo.py --ledger "$tmpdir/jgi-demo.jsonl"
